[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./out" }]
gas_reports = ["UpfrontHook", "UpfrontLauncher"]

# PositionManager is only compiled for tests and needs via-ir; everything else stays legacy.
additional_compiler_profiles = [{ name = "posm", via_ir = true, optimizer_runs = 30_000 }]
compilation_restrictions = [
  { paths = "lib/uniswap-hooks/lib/v4-periphery/src/PositionManager.sol", via_ir = true },
]

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

# CI: SECURITY.md §2 requires at least 10,000 runs.
[profile.ci.fuzz]
runs = 10_000

[profile.ci.invariant]
runs = 10_000
depth = 32
fail_on_revert = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
number_underscore = "thousands"
sort_imports = true
